[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppc-smarthack"
version = "0.1.0"
description = "Dynamic export limits for prosumers: forecast, decide, guard, act"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyarrow==26.0.1",
]

[project.optional-dependencies]
ml = ["scikit-learn==1.9.1"]
sim = ["pandapower==3.5.6", "simbench==1.6.3", "numba>=0.60"]
grid-tools = ["opendssdirect.py==0.9.4"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.common" = ["mocks/*.json"]
"src.ui" = ["static/*", "static/map/*", "mocks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
